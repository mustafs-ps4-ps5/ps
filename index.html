<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Mustafa PS4 PS5</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Tajawal:wght@400;700&display=swap');

    :root {
      --orange: #ff6b35;
      --cyan: #00ccff;
      --pink: #ff2e63;
      --bg-dark: #0d1326;
      --bg-mid: #0a0e1a;
      --bg-light: #050810;
      --text-primary: #ffffff;
      --text-secondary: #8899bb;
      --text-log: #b8c8e0;
      --success: #00ff88;
      --error: #ff2e63;
      --font: 'Orbitron', 'Tajawal', 'Arial', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: radial-gradient(ellipse at center, var(--bg-dark) 0%, var(--bg-mid) 50%, var(--bg-light) 100%);
      color: var(--text-primary);
      font-family: var(--font);
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 46, 99, 0.25);
      border-radius: 10px;
    }

    .header {
      position: relative;
      padding: 12px 16px 6px 16px;
      text-align: center;
      z-index: 1;
    }

    .header-glow {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 120px;
      background: radial-gradient(ellipse, rgba(255, 107, 53, 0.08), transparent 70%);
      pointer-events: none;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(28px, 4.5vw, 52px);
      font-weight: 900;
      letter-spacing: 0px;
      line-height: 1.2;
      margin: 0 0 2px 0;
      text-shadow: 0 0 40px rgba(255, 107, 53, 0.06);
    }

    .title-m { color: #ff6b35; }
    .title-u { color: #ff8c42; }
    .title-s { color: #ffaa33; }
    .title-t { color: #ffcc44; }
    .title-a1 { color: #ffdd55; }
    .title-f { color: #ffee66; }
    .title-a2 { color: #ffdd55; }
    .title-space { display: inline-block; width: 12px; }
    .title-p1 { color: #00ccff; }
    .title-s1 { color: #0099ff; }
    .title-4 { color: #0066ff; }
    .title-p2 { color: #ff66cc; }
    .title-s2 { color: #ff33cc; }
    .title-5 { color: #ff0066; }

    .subtitle {
      font-size: clamp(10px, 0.9vw, 14px);
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: clamp(3px, 0.6vw, 6px);
      text-transform: uppercase;
      margin: 0 0 2px 0;
      opacity: 0.9;
    }

    .subtitle .fw-range { color: var(--cyan); }

    .fw-info {
      font-size: clamp(11px, 0.8vw, 15px);
      color: var(--text-secondary);
      margin: 0;
    }

    .fw-info .fw-bold {
      color: var(--orange);
      font-weight: 800;
      text-shadow: 0 0 20px rgba(255, 107, 53, 0.15);
    }

    #main-content {
      position: relative;
      flex: 1;
      z-index: 1;
    }

    #main-content .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
      display: flex;
      flex-direction: column;
    }

    #main-content .selected {
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    #pre-jb-view {
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
    }

    #cache-status {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 7px 12px;
      width: 60%;
      max-width: 360px;
      min-width: 200px;
      margin: 0 auto 8px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 46, 99, 0.20);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      font-size: clamp(10px, 0.8vw, 12px);
      letter-spacing: 0.5px;
      text-align: left;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #cache-status.hidden {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    #cache-status[data-state="success"] {
      border-color: rgba(0, 255, 136, 0.30);
      color: var(--success);
    }

    #cache-status[data-state="error"] {
      border-color: rgba(255, 46, 99, 0.40);
      color: var(--error);
    }

    #cache-status[data-state="downloading"] {
      border-color: rgba(0, 204, 255, 0.30);
      color: var(--cyan);
    }

    #cache-progress {
      grid-column: 1 / -1;
      width: 100%;
      height: 6px;
      border: 0;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
      accent-color: var(--orange);
      overflow: hidden;
    }

    #cache-progress::-webkit-progress-bar {
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
    }

    #cache-progress::-webkit-progress-value {
      border-radius: 3px;
      background: linear-gradient(90deg, var(--orange), var(--pink));
      transition: width 0.3s ease;
    }

    #cache-status[data-state="error"] #cache-progress::-webkit-progress-value {
      background: #dd7777;
    }

    .btn {
      padding: 14px 28px;
      text-align: center;
      cursor: pointer;
      border-radius: 30px;
      border: 2px solid rgba(255, 46, 99, 0.2);
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.10), rgba(255, 46, 99, 0.10));
      color: var(--text-primary);
      font-size: clamp(1rem, 1.2vw, 1.3rem);
      font-family: var(--font);
      font-weight: 700;
      transition: all 0.3s ease;
      width: 60%;
      max-width: 360px;
      min-width: 200px;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      display: inline-block;
      line-height: 1.5;
    }

    .btn:hover {
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.20), rgba(255, 46, 99, 0.20));
      border-color: var(--orange);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 40px rgba(255, 46, 99, 0.12);
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--orange), var(--pink)) !important;
      border-color: transparent !important;
      color: #fff !important;
      box-shadow: 0 8px 40px rgba(255, 46, 99, 0.25);
    }

    .btn-primary:hover {
      box-shadow: 0 12px 60px rgba(255, 46, 99, 0.40) !important;
      transform: translateY(-2px) scale(1.03) !important;
    }

    #console-view { padding: 8px; }

    .log {
      flex: 1;
      font-family: 'Courier New', 'Consolas', monospace;
      white-space: pre-wrap;
      color: var(--text-log);
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 46, 99, 0.10);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 4px 8px;
      overflow-y: auto;
      font-size: clamp(0.7rem, 0.8vw, 0.9rem);
      line-height: 1.6;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(4px);
    }

    .footer {
      position: relative;
      text-align: center;
      padding: 6px 12px 10px 12px;
      z-index: 1;
    }

    .footer-version {
      font-size: 0.7rem;
      color: var(--text-secondary);
      opacity: 0.5;
      margin: 0;
    }

    .footer-credits {
      font-size: clamp(0.55rem, 0.7vw, 0.8rem);
      line-height: 1.6;
      color: var(--text-secondary) !important;
      margin: 2px 0 0 0;
      opacity: 0.7;
    }

    #cat { display: none !important; }

    @media (max-width: 768px) {
      .btn { width: 75%; }
      #cache-status { width: 75%; }
    }

    @media (max-width: 480px) {
      .btn { width: 85%; padding: 12px 16px; font-size: 0.85rem; }
      #cache-status { width: 85%; padding: 8px 10px; font-size: 10px; }
      .log { font-size: 0.6rem; padding: 6px 10px; margin: 2px 4px; border-radius: 8px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-glow"></div>
    <h1 class="title">
      <span class="title-m">M</span>
      <span class="title-u">u</span>
      <span class="title-s">s</span>
      <span class="title-t">t</span>
      <span class="title-a1">a</span>
      <span class="title-f">f</span>
      <span class="title-a2">a</span>
      <span class="title-space"></span>
      <span class="title-p1">P</span>
      <span class="title-s1">S</span>
      <span class="title-4">4</span>
      <span class="title-space"></span>
      <span class="title-p2">P</span>
      <span class="title-s2">S</span>
      <span class="title-5">5</span>
    </h1>
    <p class="subtitle">PS5 Relapse · <span class="fw-range">7.00 - 13.60</span></p>
    <p class="fw-info">Current firmware: <span class="fw-bold" id="current-fw">...</span></p>
  </header>

  <div id="main-content">
    <div id="pre-jb-view" class="view selected">
      <div id="cache-status" data-state="checking" role="status" aria-live="polite">
        <span id="cache-label">Checking cache...</span>
        <span id="cache-count">Waiting</span>
        <progress id="cache-progress" max="1" value="0" aria-label="Cache download progress"></progress>
      </div>

      <a tabindex="0" class="btn btn-primary" id="run-jb">JAILBREAK</a>
    </div>

    <div id="console-view" class="view">
      <div id="console" class="log"></div>
    </div>
  </div>

  <footer class="footer">
    <p class="footer-version" id="version">v1.0</p>
    <p class="footer-credits">Special thanks to all scene developers</p>
  </footer>

  <img id="cat" src="./mmhmm-cats-ps5.gif" alt="" style="display:none;">

  <!-- ===== CACHE MANAGER ===== -->
  <script>
    (() => {
      const status = document.getElementById("cache-status");
      const label = document.getElementById("cache-label");
      const count = document.getElementById("cache-count");
      const progress = document.getElementById("cache-progress");
      const cache = window.applicationCache;

      function showState(text, state) {
        label.textContent = text;
        status.dataset.state = state;
      }

      if (!cache) {
        showState("Offline cache is not supported", "error");
      } else {
        cache.addEventListener("checking", () => showState("Checking cache...", "checking"));
        cache.addEventListener("downloading", () => {
          count.textContent = "0 / ? resources";
          progress.value = 0;
          showState("Downloading cache...", "downloading");
        });
        cache.addEventListener("progress", (event) => {
          const total = event.total || 0;
          count.textContent = `${event.loaded} / ${total || "?"} resources`;
          if (total) progress.value = event.loaded / total;
          showState("Downloading cache...", "downloading");
        });
        cache.addEventListener("cached", () => {
          progress.value = 1;
          showState("Cache downloaded successfully", "success");
          if (count.textContent === "Waiting") count.textContent = "Ready";
        });
        cache.addEventListener("noupdate", () => {
          progress.value = 1;
          count.textContent = "Up to date";
          showState("Cache is ready", "success");
        });
        cache.addEventListener("updateready", () => {
          progress.value = 1;
          showState("Cache update downloaded successfully", "success");
        });
        cache.addEventListener("error", () => showState("Cache download failed", "error"));
        cache.addEventListener("obsolete", () => showState("Cache manifest is unavailable", "error"));

        if (cache.status === cache.IDLE) {
          progress.value = 1;
          count.textContent = "Ready";
          showState("Cache is ready", "success");
        } else if (cache.status === cache.UPDATEREADY) {
          progress.value = 1;
          showState("Cache update downloaded successfully", "success");
        } else if (cache.status === cache.OBSOLETE) {
          showState("Cache manifest is unavailable", "error");
        } else if (cache.status === cache.DOWNLOADING) {
          showState("Downloading cache...", "downloading");
        }
      }
    })();
  </script>

  <!-- ===== JAILBREAK BUTTON ===== -->
  <script>
    window.addEventListener("DOMContentLoaded", function() {
      const fwEl = document.getElementById("current-fw");
      if (fwEl) fwEl.textContent = window.fw_str || "Unknown";
    });

    window.__EXPLOIT_STARTED__ = false;
    document.getElementById("run-jb").addEventListener("click", function() {
      if (window.__EXPLOIT_STARTED__) return;
      window.__EXPLOIT_STARTED__ = true;

      document.getElementById("pre-jb-view").classList.remove("selected");
      document.getElementById("console-view").classList.add("selected");

      window.dispatchEvent(new Event("exploit-start"));
    });
  </script>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
